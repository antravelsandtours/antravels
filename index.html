<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AN Travels and Tours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#0e1626;--bg2:#15203a;--ink:#f3ede0;--mute:#b4b9c6;--gold:#c9a96a;--line:rgba(201,169,106,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.7 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.1;margin:0}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,22,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(14,22,38,.94);z-index:10}
.bar{max-width:1100px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font:600 26px "Cormorant Garamond",serif;text-decoration:none;letter-spacing:.04em;color:var(--gold)}
.logo small{display:block;font:300 12px Jost,sans-serif;letter-spacing:.18em;color:var(--mute)}
nav{display:flex;gap:6px 20px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:15px;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hero{background-size:cover;background-position:center;min-height:78vh;display:flex;align-items:flex-end;padding:60px 22px;background:var(--bgimg,linear-gradient(160deg,#1b2a4a,#0e1626 70%));position:relative;overflow:hidden}
.hero,.dest{background-repeat:no-repeat;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,22,38,.92),rgba(14,22,38,.15) 65%)}
.hero .in{position:relative;z-index:1;max-width:1100px;margin:auto;width:100%}
.hero h1{font-size:clamp(42px,8vw,92px);max-width:14ch}
.hero p{max-width:52ch;color:var(--mute);font-size:19px;margin:18px 0 26px}
.hero h1,.hero p{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.ghost{position:absolute;right:-10px;bottom:-30px;font:600 clamp(90px,22vw,300px)/1 "Cormorant Garamond",serif;color:rgba(201,169,106,.09);white-space:nowrap;z-index:0}
.btn{display:inline-block;padding:13px 28px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-weight:400;letter-spacing:.04em;background:transparent;cursor:pointer;font-family:inherit;font-size:16px}
.btn:hover{background:var(--gold);color:var(--bg)}
section{max-width:1100px;margin:auto;padding:72px 22px}
h2{font-size:clamp(32px,5vw,48px);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.dest{background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;min-height:290px;padding:24px;text-decoration:none;border:1px solid var(--line);background:var(--g);position:relative}
.dest h3{font-size:34px}
.dest span{color:var(--mute);font-size:15px}
.dest:hover{border-color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px}
.box{border-top:1px solid var(--gold);padding-top:18px}
.box h3{font-size:28px;margin-bottom:12px}
ul,ol{margin:0;padding-left:20px;color:var(--mute)}
li{margin:7px 0}
li::marker{color:var(--gold)}
.cl{columns:3 170px;column-gap:28px}.cl li{break-inside:avoid}
.note{margin-top:44px;padding:20px 24px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);font-size:15px}
.wide{max-width:70ch}
.wide p,.wide li{color:var(--mute)}
.wide h3{font-size:26px;margin:30px 0 8px;color:var(--ink)}
footer{border-top:1px solid var(--line);background:var(--bg2)}
.fin{max-width:1100px;margin:auto;padding:44px 22px;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.soc{display:flex;gap:12px;flex-wrap:wrap}
.soc a{padding:9px 20px;border:1px solid var(--line);text-decoration:none;font-size:15px}
.soc a:hover{border-color:var(--gold);color:var(--gold)}
.wa{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;width:62px;height:62px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.wa svg{width:34px;height:34px;fill:#fff}
.wa:hover{transform:scale(1.07)}
@media(prefers-reduced-motion:no-preference){.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ring 2.2s ease-out infinite}@keyframes ring{to{transform:scale(1.5);opacity:0}}}
.copy{max-width:1100px;margin:auto;padding:0 22px 30px;color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:no-preference){.hero .in{animation:rise 1s ease both}@keyframes rise{from{opacity:0;transform:translateY(18px)}}}
</style>
</head>
